name: 不具合報告・質問
description: サンプルの実行や使い方について報告・質問します。
body:
  - type: markdown
    attributes:
      value: 認証情報・個人情報・非公開コードを含めないでください。ログは必要な箇所を抜粋してください。
  - type: textarea
    id: report
    attributes:
      label: 不具合・質問の内容
      description: 実行コマンド、期待した動作、実際の動作、再現手順を記載してください。
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: 実行環境
      description: OS、Node.js・npmのバージョン、ローカルまたはGitHub Actionsのどちらで実行したかを記載してください。
  - type: textarea
    id: logs
    attributes:
      label: 関連するエラー・ログ
      description: 公開できる範囲で、問題の特定に必要な箇所を抜粋してください。
